  <body>
    <div id="app"></div>

    <nav class="topnav" aria-label="Game">
      <button type="button" class="topnav__tab is-active" data-screen="map">Map</button>
      <button type="button" class="topnav__tab" data-screen="status">Status</button>
      <button type="button" class="topnav__tab" data-screen="party">Party</button>
    </nav>

    <main id="status" class="screen status" hidden></main>
    <main id="party" class="screen party" hidden></main>

    <div class="hud-corner">
      <button id="back" type="button" class="hud chip" hidden>‹ World</button>
      <nav class="hud hud--places" aria-label="Places">
        <details>
          <summary id="view-title">World Map</summary>
          <ul id="places"></ul>
        </details>
      </nav>
    </div>

    <aside id="panel" class="panel" hidden>
      <button type="button" class="panel__close" aria-label="Close">×</button>
      <img class="panel__image" hidden />
      <div class="panel__body">
        <p class="panel__subtitle"></p>
        <h2 class="panel__title"></h2>
        <p class="panel__text"></p>
        <button type="button" class="panel__action" hidden>Explore the city →</button>
      </div>
    </aside>

    <div class="hud-stack">
      <button id="home" type="button" class="hud round" aria-label="Show the whole map" title="Show the whole map">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
        </svg>
      </button>
      <button id="compass" type="button" class="hud round compass" aria-label="Turn the map north-up" title="North up">
        <svg class="compass__needle" viewBox="0 0 40 40" aria-hidden="true">
          <path d="M20 5 L26 20 L14 20 Z" fill="#9a3b3b" />
          <path d="M20 35 L26 20 L14 20 Z" fill="#d9c7a0" />
          <text x="20" y="4.5" text-anchor="middle" font-size="7" font-weight="700" fill="#3b2f22" dominant-baseline="hanging">N</text>
        </svg>
      </button>
    </div>

    <button id="help-toggle" type="button" class="hud round" aria-label="Controls and settings" aria-expanded="false">?</button>
    <div id="help" class="hud help" hidden>
      <span class="for-mouse"><b>Drag</b> move · <b>Right-drag</b> rotate · <b>Scroll</b> zoom</span>
      <span class="for-mouse"><b>WASD</b> move · <b>Q E</b> rotate</span>
      <span class="for-touch"><b>Drag</b> move · <b>Pinch</b> zoom</span>
      <span class="for-touch"><b>Twist</b> rotate · <b>Two fingers up/down</b> tilt</span>
      <label class="toggle"><input id="tilt" type="checkbox" checked /> Miniature blur</label>
    </div>

    <div class="rotate" aria-live="polite">
      <svg class="rotate__phone" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="20" y="6" width="24" height="52" rx="5" fill="none" stroke="currentColor" stroke-width="3" />
        <circle cx="32" cy="51" r="2.2" fill="currentColor" />
      </svg>
      <p class="rotate__title">Turn your phone sideways</p>
      <p class="rotate__text">The map is made for landscape.</p>
    </div>

  </body>
</html>
